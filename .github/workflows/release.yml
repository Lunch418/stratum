# Установщики десктопной программы для Linux, Windows и macOS.
#
# - вручную (Actions → release → Run workflow): установщики появляются
#   артефактами запуска, релиз не создаётся;
# - по метке `v*` (например, v0.2.0): то же, плюс черновик релиза GitHub с
#   приложенными .deb, .AppImage, .msi, .exe и .dmg. Черновик публикует
#   владелец вручную. Метка должна совпадать с версией в tauri.conf.json.
#
# Установщики не подписаны: Windows SmartScreen и macOS Gatekeeper при
# первом запуске предупредят о неизвестном издателе.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 — чтобы пакет шёл и на системах со старой glibc
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
            out: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
            out: |
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            out: |
              app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.name }}
      - name: системные библиотеки WebKit
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: метка совпадает с версией программы
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: app
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "метка $GITHUB_REF_NAME, а в tauri.conf.json версия $version" >&2
            exit 1
          fi
      - name: npm ci
        working-directory: app
        run: npm ci
      # beforeBuildCommand сам собирает IDE (npm run build) и вшивает её в программу
      - name: сборка установщиков
        shell: bash
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - name: пакет .deb запускается и отдаёт IDE
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir=$(mktemp -d)
          dpkg-deb -x app/src-tauri/target/release/bundle/deb/*.deb "$dir"
          WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a tools/smoke_desktop.sh "$dir/usr/bin/stratum-modern"
      - uses: actions/upload-artifact@v4
        with:
          name: stratum-modern-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
